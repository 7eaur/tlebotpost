name: V3 Foundation

on:
  push:
    branches:
      - rebuild/v3-foundation-20261007
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/v3-foundation.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: V3 foundation tests
        run: pytest -q tests/test_v3_foundation.py
      - name: Full unit suite
        run: pytest -q -m "not integration"
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q app scripts
      - name: Migration runner
        run: alembic history
      - name: V3 CLI
        run: python -m app.v3 --help
      - name: Docker build
        run: docker build -t tlebotpost-v3 .
