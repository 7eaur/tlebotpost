name: V3 Rebuild Verification

on:
  push:
    branches:
      - rebuild/v3-foundation-20261007
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/v3-foundation.yml"

concurrency:
  group: v3-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telegram_relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d telegram_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay-test-password@127.0.0.1:5432/telegram_relay
      TEST_DATABASE_URL: postgresql+asyncpg://relay:relay-test-password@127.0.0.1:5432/telegram_relay
      PGPASSWORD: relay-test-password
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: V3 phase contract tests
        run: >-
          pytest -q
          tests/test_v3_foundation.py
          tests/test_v3_route_execution_contracts.py
          tests/test_v3_content_processing.py
          tests/test_v3_deduplication.py
          tests/test_v3_publish_queue.py
          tests/test_v3_publisher.py
          tests/test_v3_control.py
      - name: Full unit suite
        run: pytest -q -m "not integration"
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q app scripts migrations
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap V2 reference schema
        run: psql -h 127.0.0.1 -U relay -d telegram_relay -f db/schema.sql
      - name: V3 migration roundtrip
        run: |
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head
      - name: V3 PostgreSQL through control-plane integration
        run: >-
          pytest -q
          tests/integration/test_v3_route_execution_postgres.py
          tests/integration/test_v3_telegram_ingestion_postgres.py
          tests/integration/test_v3_content_processing_postgres.py
          tests/integration/test_v3_deduplication_postgres.py
          tests/integration/test_v3_publish_queue_postgres.py
          tests/integration/test_v3_publisher_postgres.py
          tests/integration/test_v3_control_postgres.py
      - name: V3 CLI
        run: python -m app.v3 --help
      - name: Docker build
        run: docker build -t tlebotpost-v3 .
