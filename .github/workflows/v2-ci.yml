name: V2 CI

on:
  push:
    branches:
      - main
      - "feature/v2-*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telegram_relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d telegram_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay-ci@127.0.0.1:5432/telegram_relay
      TEST_DATABASE_URL: postgresql+asyncpg://relay:relay-ci@127.0.0.1:5432/telegram_relay
      PGPASSWORD: relay-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Compile
        working-directory: backend
        run: python -m compileall -q app scripts

      - name: Unit tests
        working-directory: backend
        run: pytest -q -m "not integration"

      - name: Apply PostgreSQL schema
        working-directory: backend
        run: psql -h 127.0.0.1 -U relay -d telegram_relay -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: PostgreSQL integration tests
        working-directory: backend
        run: pytest -q -m integration

      - name: Docker build
        run: docker build -t tlebotpost-v2-ci ./backend
