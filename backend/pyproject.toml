[project]
name = "telegram-channel-relay"
version = "0.1.0"
description = "Live-only Telegram channel relay with bot control"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "cryptography>=42,<44",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=21,<23",
  "telethon>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
