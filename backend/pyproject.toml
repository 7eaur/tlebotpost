[project]
name = "telegram-channel-relay"
version = "0.1.0"
description = "Telegram content distribution platform"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "cryptography>=42,<44",
  "croniter>=2,<7",
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "python-telegram-bot>=21,<23",
  "sqlalchemy[asyncio]>=2.0,<3",
  "telethon>=1.35,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a live PostgreSQL database, normally provided by Docker Compose",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/web.py" = ["E501", "I001"]
