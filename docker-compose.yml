services:
  postgres:
    image: postgres:16-alpine
    container_name: telegram-relay-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true

  runtime-v2:
    build:
      context: ./backend
    container_name: telegram-relay-runtime-v2
    command: ["python", "scripts/run_service.py", "--env-file", "/dev/null"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/${POSTGRES_DB:-telegram_relay}
      V2_SESSION_PATH: /app/data/v2.session
      V2_MEDIA_ROOT: /app/data/media
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.health_v2"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3

  runtime-v2-integration:
    profiles: ["integration"]
    build:
      context: ./backend
    container_name: telegram-relay-runtime-v2-integration
    command: ["python", "scripts/integration_postgres.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/${POSTGRES_DB:-telegram_relay}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true

volumes:
  postgres_data:
    name: telegram-relay-postgres-data
