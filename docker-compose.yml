services:
  relay:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
